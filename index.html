<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Prateek Design System</title>
  <meta name="description" content="Prateek's personal design system: tokens, components and guidelines, in light and dark.">
  <meta name="color-scheme" content="light dark">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { var t = localStorage.getItem('pk-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@400&display=swap">
  <link rel="stylesheet" href="tokens/tokens.css">
  <link rel="stylesheet" href="components/bundle.css">
  <link rel="stylesheet" href="site/site.css" data-site-only>
</head>
<body>
  <div id="app"></div>
  <noscript><p style="padding:24px">This page needs JavaScript to render the live components.</p></noscript>
  <script src="vendor/react.production.min.js"></script>
  <script src="vendor/react-dom.production.min.js"></script>
  <script src="components/bundle.js"></script>
  <script src="examples/portfolio.js"></script>
  <script src="site/tokens.data.js"></script>
  <script src="site/docs.data.js"></script>
  <script src="site/app.js"></script>
</body>
</html>
